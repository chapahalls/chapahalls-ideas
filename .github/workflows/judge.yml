name: Judge

# Dois judges em sequência, para a main sempre ter a nota do projeto inteiro:
#   1. /judge <repo>   → repos/<repo>/score.md (só o repo que mudou: H1+H2, /20)
#   2. /judge projeto  → docs/report/judge-*.md + STATUS.md (os quatro repos, /40)
#
# Gatilhos:
#   - repository_dispatch "judge": enviado pelo .github/workflows/judge.yml de
#     rodar-backend, rodar-web e rodar-mobile a cada push na main deles (passos 1 e 2);
#   - push na main deste repo mudando repos/*/score.md, ou seja, alguém rodou /judge <repo>
#     na mão e commitou (só o passo 2). O commit da própria CI usa o GITHUB_TOKEN e não redispara;
#   - workflow_dispatch: na mão pela aba Actions, com o repo opcional.
#
# Configuração (Settings → Secrets and variables → Actions):
#   Secrets: AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY (sem eles o judge é pulado).
#   Variables: AWS_REGION (obrigatória), JUDGE_MODEL (opcional: ID do modelo no Bedrock).
# Nos repos de código: secret IDEAS_DISPATCH_TOKEN (dispara este workflow).

on:
  repository_dispatch:
    types: [judge]
  push:
    branches: [main]
    paths: ['repos/*/score.md']
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo para o judge do repo antes do projeto (vazio = só o projeto)"
        type: choice
        options: ['', rodar-backend, rodar-web, rodar-mobile]
        default: ''

permissions:
  contents: write

# Um judge por vez. Pushes em sequência não cancelam o que está rodando:
# o GitHub guarda só o último pendente, que avalia o estado mais novo de todos os repos.
concurrency:
  group: judge
  cancel-in-progress: false

env:
  CODE_REPOS: rodar-backend rodar-web rodar-mobile rodar-keycloak
  SCOPED_REPO: ${{ github.event.client_payload.repo || inputs.repo || '' }}
  TRIGGER_REPO: ${{ github.event.client_payload.repo || inputs.repo || (github.event_name == 'push' && 'rodar-ideas') || 'manual' }}
  TRIGGER_SHA: ${{ github.event.client_payload.sha || (github.event_name == 'push' && github.sha) || '' }}
  TRIGGER_ACTOR: ${{ github.event.client_payload.actor || github.actor }}

jobs:
  # Secret não entra no `if` de um job: este job só diz se a chave da AWS existe.
  credencial:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::sem o secret AWS_ACCESS_KEY_ID: judge pulado"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  judge:
    needs: credencial
    if: needs.credencial.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # o Claude roda sem o token de escrita

      - name: Login na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clonar os repositórios de código ao lado deste
        # Histórico completo: o check-rules confere a data do primeiro commit (X1).
        run: |
          cd ..
          for r in $CODE_REPOS; do
            git clone --quiet "https://github.com/rodarglobal/$r" "$r"
            echo "$r $(git -C "$r" rev-parse --short HEAD)" >> "$RUNNER_TEMP/shas.txt"
          done
          cat "$RUNNER_TEMP/shas.txt"

      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Judge do repo (/judge <repo>)
        if: contains(fromJSON('["rodar-backend","rodar-web","rodar-mobile"]'), env.SCOPED_REPO)
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ vars.AWS_REGION }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: |
          model=""; [ -n "$JUDGE_MODEL" ] && model="--model $JUDGE_MODEL"
          sha=$(git -C "../$SCOPED_REPO" rev-parse --short HEAD)
          when=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')
          claude -p $model --add-dir "../$SCOPED_REPO" \
            --permission-mode acceptEdits \
            --allowedTools "Bash Read Write Edit Glob Grep Agent Task Skill" \
            --max-turns 60 \
            "/judge $SCOPED_REPO

          Execução automática na CI (sem humano para responder: não pergunte nada).
          Data/hora: $when (America/Sao_Paulo).
          Gatilho: push na main de $SCOPED_REPO ${TRIGGER_SHA:0:7} por $TRIGGER_ACTOR. Commit avaliado: $sha.
          Inclua essa linha de gatilho logo abaixo do título.
          Salve em repos/$SCOPED_REPO/score.md e não escreva em nenhum outro lugar."
          if git diff --quiet -- "repos/$SCOPED_REPO/score.md"; then
            echo "::error::o judge do repo não atualizou repos/$SCOPED_REPO/score.md"; exit 1
          fi

      - name: Judge (Claude Code, /judge projeto)
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_REGION: ${{ vars.AWS_REGION }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: |
          dirs=""; for r in $CODE_REPOS; do dirs="$dirs --add-dir ../$r"; done
          model=""; [ -n "$JUDGE_MODEL" ] && model="--model $JUDGE_MODEL"
          shas=$(tr '\n' ',' < "$RUNNER_TEMP/shas.txt" | sed 's/,$//; s/,/, /g')
          when=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')
          claude -p $model $dirs \
            --permission-mode acceptEdits \
            --allowedTools "Bash Read Write Edit Glob Grep Agent Task Skill" \
            --max-turns 80 \
            "/judge projeto

          Execução automática na CI (sem humano para responder: não pergunte nada).
          Data/hora: $when (America/Sao_Paulo).
          Gatilho: push na main de $TRIGGER_REPO ${TRIGGER_SHA:0:7} por $TRIGGER_ACTOR.
          Repositórios avaliados (clonados em ../): $shas.
          Inclua essa linha de gatilho e os SHAs logo abaixo do título do relatório.
          Comece pelos repos/*/score.md (o de $TRIGGER_REPO acabou de ser refeito, se for um repo de código).
          Salve o relatório em docs/report/judge-<YYYYMMDD-HHMM>.md, reescreva o STATUS.md da raiz e não escreva em nenhum outro lugar."

      - name: Publicar em docs/report/
        id: report
        run: |
          report=$(git ls-files --others --exclude-standard docs/report/ | grep '/judge-.*\.md$' | sort | tail -1)
          [ -n "$report" ] || { echo "::error::o judge não gerou relatório em docs/report/"; exit 1; }
          score=$(grep -oE 'Nota estimada: *\**[0-9]+ */ *40' "$report" | grep -oE '[0-9]+' | head -1)
          score=${score:-?}
          cp "$report" docs/report/LATEST.md
          when=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')
          trigger="$TRIGGER_REPO${TRIGGER_SHA:+@${TRIGGER_SHA:0:7}}"
          echo "| $when | $trigger | $score/40 | [$(basename "$report")]($(basename "$report")) |" >> docs/report/README.md
          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit e push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report/ STATUS.md repos/*/score.md
          git commit -q -m "docs(report): judge após ${{ steps.report.outputs.trigger }} (${{ steps.report.outputs.score }}/40)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          for i in 1 2 3 4; do
            git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
