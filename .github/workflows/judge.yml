name: Judge

# Roda o /judge projeto (skill + agente judge deste repo) sempre que algum
# repositório de código recebe push na main, e publica o relatório em docs/report/.
#
# Gatilhos:
#   - repository_dispatch "judge": enviado pelo .github/workflows/judge.yml de
#     rodar-backend, rodar-web, rodar-mobile e rodar-keycloak;
#   - workflow_dispatch: rodar na mão pela aba Actions.
#
# Precisa do secret ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN neste repo. Modelo opcional: variável JUDGE_MODEL.

on:
  repository_dispatch:
    types: [judge]
  workflow_dispatch:

permissions:
  contents: write

# Um judge por vez. Pushes em sequência não cancelam o que está rodando:
# o GitHub guarda só o último pendente, que avalia o estado mais novo de todos os repos.
concurrency:
  group: judge
  cancel-in-progress: false

env:
  CODE_REPOS: rodar-backend rodar-web rodar-mobile rodar-keycloak
  TRIGGER_REPO: ${{ github.event.client_payload.repo || 'manual' }}
  TRIGGER_SHA: ${{ github.event.client_payload.sha || '' }}
  TRIGGER_ACTOR: ${{ github.event.client_payload.actor || github.actor }}

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # o Claude roda sem o token de escrita

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clonar os repositórios de código ao lado deste
        # Histórico completo: o check-rules confere a data do primeiro commit (X1).
        run: |
          cd ..
          for r in $CODE_REPOS; do
            git clone --quiet "https://github.com/rodarglobal/$r" "$r"
            echo "$r $(git -C "$r" rev-parse --short HEAD)" >> "$RUNNER_TEMP/shas.txt"
          done
          cat "$RUNNER_TEMP/shas.txt"

      - name: Judge (Claude Code, /judge projeto)
        env:
          # Um dos dois: chave da API ou token da assinatura Claude Pro/Max (`claude setup-token`).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: |
          npm install -g @anthropic-ai/claude-code
          dirs=""; for r in $CODE_REPOS; do dirs="$dirs --add-dir ../$r"; done
          model=""; [ -n "$JUDGE_MODEL" ] && model="--model $JUDGE_MODEL"
          shas=$(tr '\n' ',' < "$RUNNER_TEMP/shas.txt" | sed 's/,$//; s/,/, /g')
          when=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')
          claude -p $model $dirs \
            --permission-mode acceptEdits \
            --allowedTools "Bash Read Write Edit Glob Grep Agent Task Skill" \
            --max-turns 80 \
            "/judge projeto

          Execução automática na CI (sem humano para responder: não pergunte nada).
          Data/hora: $when (America/Sao_Paulo).
          Gatilho: push na main de $TRIGGER_REPO ${TRIGGER_SHA:0:7} por $TRIGGER_ACTOR.
          Repositórios avaliados (clonados em ../): $shas.
          Inclua essa linha de gatilho e os SHAs logo abaixo do título do relatório.
          Salve o relatório em docs/report/judge-<YYYYMMDD-HHMM>.md e não escreva em nenhum outro lugar."

      - name: Publicar em docs/report/
        id: report
        run: |
          report=$(git ls-files --others --exclude-standard docs/report/ | grep '/judge-.*\.md$' | sort | tail -1)
          [ -n "$report" ] || { echo "::error::o judge não gerou relatório em docs/report/"; exit 1; }
          score=$(grep -oE 'Nota estimada: *\**[0-9]+ */ *40' "$report" | grep -oE '[0-9]+' | head -1)
          score=${score:-?}
          cp "$report" docs/report/LATEST.md
          when=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')
          trigger="$TRIGGER_REPO${TRIGGER_SHA:+@${TRIGGER_SHA:0:7}}"
          echo "| $when | $trigger | $score/40 | [$(basename "$report")]($(basename "$report")) |" >> docs/report/README.md
          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit e push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report/
          git commit -q -m "docs(report): judge após ${{ steps.report.outputs.trigger }} (${{ steps.report.outputs.score }}/40)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          for i in 1 2 3 4; do
            git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
