  <form class="new" id="new"><h2>Novo problema</h2>
   <label for="f-p">Problema</label><input id="f-p" name="problema" required>
   <label for="f-c">Causa</label><input id="f-c" name="causa">
   <label for="f-s">Solução proposta</label><input id="f-s" name="solucao">
   <label for="f-a">Área</label><input id="f-a" name="area" placeholder="Fluxo, Estadia, Técnico…">
   <div><button type="submit">Adicionar</button></div></form>
  <div class="tools"><h2>Levar para o repo</h2><button type="button" id="md">Copiar como Markdown</button><pre id="mdout" hidden></pre></div>
  </section>`;
}
function sumHTML() {
  return `<div class="o"><b>${count('aberto')}</b>abertos</div><div><b>${count('decidido')}</b>decididos</div><div><b>${count('descartado')}</b>descartados</div>`;
}
function toMD() {
  const c = s => String(s || '').replace(/\|/g, '\\|').replace(/\n/g, ' ');
  return '## Problemas / causas / soluções\n\n| # | Área | Problema | Causa | Solução | Resposta do time | Status |\n|---|---|---|---|---|---|---|\n' +
    S.items.map((i, n) => `| ${n + 1} | ${c(i.area)} | ${c(i.problema)} | ${c(i.causa)} | ${c(i.solucao)} | ${c(i.resposta)} | ${ST[i.status]} |`).join('\n') + '\n';
}

/* ---------- shell, rotas, salvar ---------- */
root.innerHTML = `<header class="band top"><p class="kick">Parceiro de Estrada · RODAR</p>
<h1>Revisão do fluxo e dos problemas</h1>
<nav class="tabs"><a href="#fluxo" data-v="fluxo">Fluxograma</a><a href="#problemas" data-v="problemas">Problemas <span class="c" id="cnt"></span></a></nav></header>
<main id="view"></main>
<div class="bar" id="bar" hidden><span id="barmsg"></span><button type="button" id="save">Salvar para o time</button></div>`;
const view = document.getElementById('view');

function route() {
  const v = location.hash === '#problemas' ? 'problemas' : 'fluxo';
  for (const a of root.querySelectorAll('.tabs a')) a.dataset.v === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  view.innerHTML = v === 'fluxo'
    ? `<section class="band"><div class="legend"><span><i></i>Ação</span><span><i class="d"></i>Decisão</span><span><i class="a"></i>Alerta ou estadia</span></div>
       <figure><div class="scroll">${flowSVG()}</div><figcaption>Cada raia mostra quem age em cada passo. O motorista só fala; a central só vê o painel; o agente faz a ponte, valida e escala. Na aproximação, o agente já avisa o recebedor (placa, NF, horário previsto). Se o CCO não responde após 3 tentativas na chegada, o agente liga de novo para o responsável pelo recebimento e repassa a resposta ao CCO e ao motorista. Em telas estreitas, role para os lados.</figcaption></figure></section>`
    : problemsHTML();
  refresh();
}
function refresh() {
  document.getElementById('cnt').textContent = `· ${count('aberto')} abertos`;
  const s = document.getElementById('sum'); if (s) s.innerHTML = sumHTML();
  const bar = document.getElementById('bar'), btn = document.getElementById('save');
  bar.hidden = !dirty && !msg;
  document.getElementById('barmsg').textContent = msg || (art ? 'Alterações não salvas' : 'Alterações não salvas · salvar não está disponível nesta visualização');
  btn.disabled = !art || readOnly || !dirty;
}
function doc() {
  const SC = '<' + '/script>';
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  const head = document.head.querySelectorAll('link');
  return '<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(document.title) + '</title>' +
    [...head].map(l => l.outerHTML).join('') +
    '<style id="css">' + document.getElementById('css').textContent + '</style></head><body><div id="root"></div>' +
    '<script type="application/json" id="state">' + json + SC +
    '<script id="app">' + document.getElementById('app').textContent + SC + '</body></html>';
}
async function save() {
  if (!art || readOnly) return;
  const btn = document.getElementById('save');
  btn.disabled = true; msg = 'Salvando…'; refresh();
  try {
    S.updated = new Date().toISOString();
    await art.publish(doc());
  } catch (e) {
    const c = String(e && (e.code || e.message) || e);
    if (/not_granted|not_writer/.test(c)) { readOnly = true; msg = 'Você tem acesso só de leitura a esta página.'; }
    else if (/conflict/.test(c)) msg = 'Outra pessoa salvou antes; a página vai recarregar com a versão dela.';
    else msg = 'Não foi possível salvar: ' + c;
    refresh();
  }
}
const item = el => S.items.find(i => i.id === +el.closest('[data-id]').dataset.id);
root.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.st) {
    const it = item(b); it.status = b.dataset.st; dirty = true; msg = '';
    const li = b.closest('.card'); li.className = 'card s-' + it.status;
    for (const x of li.querySelectorAll('[data-st]')) x.setAttribute('aria-pressed', x.dataset.st === it.status);
    refresh();
  } else if (b.dataset.fl) {
    filter = b.dataset.fl;
    for (const x of root.querySelectorAll('[data-fl]')) x.setAttribute('aria-pressed', x.dataset.fl === filter);
    document.getElementById('list').innerHTML = listHTML();
  } else if (b.id === 'save') save();
  else if (b.id === 'md') {
    const md = toMD(), out = document.getElementById('mdout');
    out.textContent = md;
    const ok = () => { b.textContent = 'Copiado'; setTimeout(() => b.textContent = 'Copiar como Markdown', 1600); };
    try { navigator.clipboard.writeText(md).then(ok, () => out.hidden = false); } catch (_) { out.hidden = false; }
  }
});
root.addEventListener('input', e => {
  const t = e.target; if (t.dataset.f !== 'resposta') return;
  item(t).resposta = t.value; dirty = true; msg = ''; refresh();
});
root.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target), v = k => String(f.get(k) || '').trim();
  if (!v('problema')) return;
  S.items.push({id: Math.max(0, ...S.items.map(i => i.id)) + 1, area: v('area') || 'Geral', problema: v('problema'), causa: v('causa'), solucao: v('solucao'), resposta: '', status: 'aberto'});
  dirty = true; msg = ''; filter = 'todos'; route();
  location.hash = '#problemas';
});
window.addEventListener('hashchange', route);
route();
try { const p = window.claude && window.claude.use && window.claude.use('artifact'); if (p) p.then(a => { art = a; refresh(); }, () => {}); } catch (_) {}
}
</script></body></html>
