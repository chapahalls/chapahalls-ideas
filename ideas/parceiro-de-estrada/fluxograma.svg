<svg width="1215" height="2292" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1215 2292" role="img" aria-label="Fluxograma do Parceiro de Estrada em quatro raias: central, agente de voz, motorista e recebedor, da preparação da rota até a descarga, incluindo a ligação ao recebedor quando o CCO não responde">
<style>text{fill:#111;font:12.5px Archivo,Arial,sans-serif}.lh{font-weight:800;font-size:14px}.ph{font-weight:800;font-size:13px}.nd{fill:#fff;stroke:#111;stroke-width:1.5}.a{fill:#fdeaee;stroke:#e4002b;stroke-width:2}.dc{fill:#fff;stroke:#111;stroke-width:2.5}.ed{fill:none;stroke:#6b6b6b;stroke-width:1.5}.lane{fill:#f3f3f3}.rule{stroke:#111;stroke-width:1.5}.lb{fill:#fff}.el{font-size:11.5px;font-weight:700}marker path{fill:#6b6b6b}</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 z"></path></marker></defs>
<text class="lh" text-anchor="middle" x="150" y="30">Central (CCO)</text><rect class="lane" x="305" y="0" width="310" height="2292"></rect><text class="lh" text-anchor="middle" x="460" y="30">Agente de voz</text><text class="lh" text-anchor="middle" x="770" y="30">Motorista</text><text class="lh" text-anchor="middle" x="1060" y="30">Recebedor da carga</text><line class="rule" x1="0" x2="1215" y1="44" y2="44"></line><line class="rule" x1="0" x2="1215" y1="54" y2="54"></line><text class="ph" x="10" y="72">1 · Preparação</text><line class="rule" x1="0" x2="1215" y1="290" y2="290"></line><text class="ph" x="10" y="308">2 · Retirada</text><line class="rule" x1="0" x2="1215" y1="718" y2="718"></line><text class="ph" x="10" y="736">3 · Viagem</text><line class="rule" x1="0" x2="1215" y1="1050" y2="1050"></line><text class="ph" x="10" y="1068">A qualquer momento</text><line class="rule" x1="0" x2="1215" y1="1286" y2="1286"></line><text class="ph" x="10" y="1304">4 · Chegada e estadia</text><line class="rule" x1="0" x2="1215" y1="1810" y2="1810"></line><text class="ph" x="10" y="1828">5 · CCO sem resposta após 3 tentativas</text><line class="rule" x1="0" x2="1215" y1="2142" y2="2142"></line><text class="ph" x="10" y="2160">6 · Descarga</text><path class="ed" marker-end="url(#ah)" d="M150 161 L150 230 L344 230"></path><path class="ed" marker-end="url(#ah)" d="M576 230 L654 230"></path><path class="ed" marker-end="url(#ah)" d="M460 257 L460 343"></path><path class="ed" marker-end="url(#ah)" d="M460 397 L460 439"></path><path class="ed" marker-end="url(#ah)" d="M576 466 L654 466"></path><path class="ed" marker-end="url(#ah)" d="M770 493 L770 562 L565 562"></path><path class="ed" marker-end="url(#ah)" d="M355 562 L266 562"></path><rect class="lb" x="294.6" y="553" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="310.5" y="566">não</text><path class="ed" marker-end="url(#ah)" d="M460 599 L460 631"></path><rect class="lb" x="444.1" y="599.6" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="460" y="612.6">sim</text><path class="ed" marker-end="url(#ah)" d="M460 685 L460 771"></path><path class="ed" marker-end="url(#ah)" d="M576 798 L654 798"></path><path class="ed" marker-end="url(#ah)" d="M770 833 L770 894 L565 894"></path><path class="ed" marker-end="url(#ah)" d="M355 894 L266 894"></path><rect class="lb" x="294.6" y="885" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="310.5" y="898">sim</text><path class="ed" marker-end="url(#ah)" d="M460 931 L460 963"></path><rect class="lb" x="444.1" y="931.6" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="460" y="944.6">não</text><path class="ed" marker-end="url(#ah)" d="M576 990 L840 990 L840 833"></path><rect class="lb" x="682.2" y="981" width="51.599999999999994" height="18"></rect><text class="el" text-anchor="middle" x="708" y="994">repete</text><path class="ed" marker-end="url(#ah)" d="M654 1130 L576 1130"></path><path class="ed" marker-end="url(#ah)" d="M344 1130 L266 1130"></path><path class="ed" marker-end="url(#ah)" d="M266 1226 L344 1226"></path><path class="ed" marker-end="url(#ah)" d="M576 1226 L654 1226"></path><path class="ed" marker-end="url(#ah)" d="M344 1366 L266 1366"></path><path class="ed" marker-end="url(#ah)" d="M576 1366 L944 1366"></path><rect class="lb" x="714.4" y="1357" width="91.19999999999999" height="18"></rect><text class="el" text-anchor="middle" x="760" y="1370">liga (Agora)</text><path class="ed" marker-end="url(#ah)" d="M460 1393 L460 1435"></path><path class="ed" marker-end="url(#ah)" d="M576 1462 L654 1462"></path><path class="ed" marker-end="url(#ah)" d="M770 1489 L770 1558 L576 1558"></path><path class="ed" marker-end="url(#ah)" d="M344 1558 L266 1558"></path><path class="ed" marker-end="url(#ah)" d="M460 1585 L460 1619"></path><rect class="lb" x="404.5" y="1586.2" width="111" height="18"></rect><text class="el" text-anchor="middle" x="460" y="1599.2">inicia contador</text><path class="ed" marker-end="url(#ah)" d="M344 1654 L150 1654 L150 1720.5"></path><path class="ed" marker-end="url(#ah)" d="M255 1750 L355 1750"></path><rect class="lb" x="289.1" y="1741" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="305" y="1754">não</text><path class="ed" marker-end="url(#ah)" d="M460 1713 L460 1689"></path><rect class="lb" x="391.3" y="1696.8" width="137.39999999999998" height="18"></rect><text class="el" text-anchor="middle" x="460" y="1709.8">não: nova tentativa</text><path class="ed" marker-end="url(#ah)" d="M150 1779.5 L150 1863"></path><rect class="lb" x="134.1" y="1795.55" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="150" y="1808.55">sim</text><path class="ed" marker-end="url(#ah)" d="M460 1787 L460 1855"></path><rect class="lb" x="444.1" y="1798.4" width="31.799999999999997" height="18"></rect><text class="el" text-anchor="middle" x="460" y="1811.4">sim</text><path class="ed" marker-end="url(#ah)" d="M576 1890 L944 1890"></path><rect class="lb" x="701.2" y="1881" width="117.6" height="18"></rect><text class="el" text-anchor="middle" x="760" y="1894">liga (Agora SIP)</text><path class="ed" marker-end="url(#ah)" d="M1060 1917 L1060 1986 L576 1986"></path><path class="ed" marker-end="url(#ah)" d="M460 2013 L460 2082 L266 2082"></path><path class="ed" marker-end="url(#ah)" d="M460 2013 L460 2082 L654 2082"></path><path class="ed" marker-end="url(#ah)" d="M770 2109 L770 2195"></path><path class="ed" marker-end="url(#ah)" d="M654 2222 L576 2222"></path><path class="ed" marker-end="url(#ah)" d="M344 2222 L266 2222"></path><rect class="nd" x="34" y="107" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="130.5">Cadastra rota, motorista,</tspan><tspan x="150" y="146.5">break points, regras e docs</tspan></text><rect class="nd" x="344" y="203" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="226.5">Envia rota e</tspan><tspan x="460" y="242.5">documentos ao app</tspan></text><rect class="nd" x="654" y="211" width="232" height="38"></rect><text text-anchor="middle"><tspan x="770" y="234.5">Recebe a rota</tspan></text><rect class="nd" x="344" y="343" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="366.5">GPS entra na</tspan><tspan x="460" y="382.5">geocerca da origem</tspan></text><rect class="nd" x="344" y="439" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="462.5">Pergunta: “confirma</tspan><tspan x="460" y="478.5">a retirada da carga?”</tspan></text><rect class="nd" x="654" y="439" width="232" height="54"></rect><text text-anchor="middle"><tspan x="770" y="462.5">Confirma por voz +</tspan><tspan x="770" y="478.5">relatório inicial</tspan></text><polygon class="dc" points="460,525 565,562 460,599 355,562"></polygon><text text-anchor="middle"><tspan x="460" y="558.5">GPS celular e</tspan><tspan x="460" y="574.5">caminhão batem?</tspan></text><rect class="nd a" x="34" y="535" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="558.5">Alerta: retirada</tspan><tspan x="150" y="574.5">não validada</tspan></text><rect class="nd" x="344" y="631" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="654.5">Registra RETIRADA</tspan><tspan x="460" y="670.5">(EventoGeo)</tspan></text><rect class="nd" x="344" y="771" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="794.5">A cada X min ou break</tspan><tspan x="460" y="810.5">point: pede o status</tspan></text><rect class="nd" x="654" y="763" width="232" height="70"></rect><text text-anchor="middle"><tspan x="770" y="786.5">Responde por voz</tspan><tspan x="770" y="802.5">(pode adiar 2 min;</tspan><tspan x="770" y="818.5">sem resposta → CCO)</tspan></text><polygon class="dc" points="460,857 565,894 460,931 355,894"></polygon><text text-anchor="middle"><tspan x="460" y="890.5">Todos os campos</tspan><tspan x="460" y="906.5">obrigatórios?</tspan></text><rect class="nd" x="34" y="867" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="890.5">Recebe reporte</tspan><tspan x="150" y="906.5">estruturado</tspan></text><rect class="nd" x="344" y="963" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="986.5">Pergunta só o</tspan><tspan x="460" y="1002.5">que faltou</tspan></text><rect class="nd" x="654" y="1103" width="232" height="54"></rect><text text-anchor="middle"><tspan x="770" y="1126.5">Wake word: ocorrência,</tspan><tspan x="770" y="1142.5">documento ou pergunta</tspan></text><rect class="nd" x="344" y="1103" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="1126.5">Registra, lê o</tspan><tspan x="460" y="1142.5">documento, responde</tspan></text><rect class="nd" x="34" y="1103" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="1126.5">Recebe a</tspan><tspan x="150" y="1142.5">ocorrência</tspan></text><rect class="nd" x="34" y="1199" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="1222.5">Solicita uma</tspan><tspan x="150" y="1238.5">informação</tspan></text><rect class="nd" x="344" y="1199" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="1222.5">Pergunta ao</tspan><tspan x="460" y="1238.5">motorista</tspan></text><rect class="nd" x="654" y="1199" width="232" height="54"></rect><text text-anchor="middle"><tspan x="770" y="1222.5">Responde; a resposta</tspan><tspan x="770" y="1238.5">volta ao CCO</tspan></text><rect class="nd" x="344" y="1339" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="1362.5">GPS: aproximando</tspan><tspan x="460" y="1378.5">do destino</tspan></text><rect class="nd" x="34" y="1339" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="1362.5">Aviso: carga</tspan><tspan x="150" y="1378.5">chegando</tspan></text><rect class="nd" x="944" y="1331" width="232" height="70"></rect><text text-anchor="middle"><tspan x="1060" y="1354.5">Recebe aviso prévio:</tspan><tspan x="1060" y="1370.5">confirma doca e horário</tspan><tspan x="1060" y="1386.5">(ou não recebe hoje)</tspan></text><rect class="nd" x="344" y="1435" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="1458.5">Geocerca do destino:</tspan><tspan x="460" y="1474.5">“confirma a chegada?”</tspan></text><rect class="nd" x="654" y="1435" width="232" height="54"></rect><text text-anchor="middle"><tspan x="770" y="1458.5">Check-in por voz: status,</tspan><tspan x="770" y="1474.5">tempo, ocorrências</tspan></text><rect class="nd" x="344" y="1531" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="1554.5">Registra CHEGADA</tspan><tspan x="460" y="1570.5">(GPS celular + caminhão)</tspan></text><rect class="nd a" x="34" y="1531" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="1554.5">Task: carga chegou</tspan><tspan x="150" y="1570.5">+ inicia estadia</tspan></text><rect class="nd" x="344" y="1619" width="232" height="70"></rect><text text-anchor="middle"><tspan x="460" y="1642.5">Notifica o CCO (tentativa N/3):</tspan><tspan x="460" y="1658.5">push → painel → ligação;</tspan><tspan x="460" y="1674.5">tempo parado + estadia</tspan></text><polygon class="dc" points="150,1720.5 255,1750 150,1779.5 45,1750"></polygon><text text-anchor="middle"><tspan x="150" y="1754.5">CCO respondeu?</tspan></text><polygon class="dc" points="460,1713 565,1750 460,1787 355,1750"></polygon><text text-anchor="middle"><tspan x="460" y="1746.5">Já foram</tspan><tspan x="460" y="1762.5">3 tentativas?</tspan></text><rect class="nd" x="34" y="1863" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="1886.5">Assume a Task e</tspan><tspan x="150" y="1902.5">trata com o recebedor</tspan></text><rect class="nd a" x="344" y="1855" width="232" height="70"></rect><text text-anchor="middle"><tspan x="460" y="1878.5">Avisa CCO e motorista e</tspan><tspan x="460" y="1894.5">liga para o responsável</tspan><tspan x="460" y="1910.5">pelo recebimento</tspan></text><rect class="nd" x="944" y="1863" width="232" height="54"></rect><text text-anchor="middle"><tspan x="1060" y="1886.5">Atende e responde:</tspan><tspan x="1060" y="1902.5">previsão, doca, motivo</tspan></text><rect class="nd" x="344" y="1959" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="1982.5">Repassa a resposta</tspan><tspan x="460" y="1998.5">do recebedor</tspan></text><rect class="nd" x="34" y="2055" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="2078.5">Recebe: ligação feita</tspan><tspan x="150" y="2094.5">+ resposta do recebedor</tspan></text><rect class="nd" x="654" y="2055" width="232" height="54"></rect><text text-anchor="middle"><tspan x="770" y="2078.5">Recebe a previsão</tspan><tspan x="770" y="2094.5">do recebedor</tspan></text><rect class="nd" x="654" y="2195" width="232" height="54"></rect><text text-anchor="middle"><tspan x="770" y="2218.5">Confirma a descarga</tspan><tspan x="770" y="2234.5">por voz</tspan></text><rect class="nd" x="344" y="2195" width="232" height="54"></rect><text text-anchor="middle"><tspan x="460" y="2218.5">Encerra Task</tspan><tspan x="460" y="2234.5">e estadia</tspan></text><rect class="nd" x="34" y="2195" width="232" height="54"></rect><text text-anchor="middle"><tspan x="150" y="2218.5">Recebe descarga +</tspan><tspan x="150" y="2234.5">estadia calculada</tspan></text></svg>